wikicite.lcn.window.faq.citation.content.p1=אפשר להגדיל ולהקטין את התצוגה באמצעות גלילה, ולהזיז את התרשים באמצעות גרירה. כל צומת (קודקוד) מייצג מאמר. הצמתים מסודרים לפי שנת הפרסום, מלמעלה (החדשים ביותר) למטה (הישנים ביותר), ולכל שנה צבע שונה. לחלופין, אפשר לצבוע את הצמתים לפי כתב העת שבו פורסם המאמר, דרך „הגדרות הרשת”. גודל הצמתים נקבע לפי הסכום של „צוטט” (Cited), מספר הציטוטים המקומיים הנכנסים שקיבל המאמר ממאמרי הבסיס, ו„מצטט” (Citing), מספר מאמרי הבסיס שהמאמר מצטט (ציטוטים מקומיים יוצאים). מספר הציטוטים המקומיים אינו בהכרח ביחס ישר למספר הציטוטים הכולל בעולם. מאמרי הבסיס מיוצגים באמצעות עיגולים (●). משולשים הפונים כלפי מעלה (▲) מייצגים את „המצוטטים ביותר” (Top Cited), כלומר מאמרים שמאמרי הבסיס מצטטים.
