wikicite.lcn.window.faq.citation.content.p1=سکرول نال زوم کرو تے کھینچݨ نال پین کرو۔ ہر نوڈ (= ورٹیکس) ہک مضمون دی نمائندگی کریندا اے۔ اینھاں کوں سال دے لحاظ نال اتے (نویں) توں تلے (پراݨے) تک ترتیب ݙتا ڳیا اے، ہر سال کوں مختلف رنگ ݙتا ڳیا اے۔ متبادل طور تے، نوڈّاں کوں 'نیٹ ورک سیٹنگز' وچ مضمون دے جرنل دے لحاظ نال وی رنگ ݙتا وݨا۔ نوڈّاں دا سائز 'حوالہ ݙتا ڳیا' تے 'حوالہ ݙیوݨ آلے' دے جوڑ تے منحصر اے — 'حوالہ ݙتا ڳیا' اونھاں مقامی آن والے حوالےآں دی تعداد اے جو پیپر کوں Seed Articles توں ملے، تے 'حوالہ ݙیوݨ آلے' اونھاں Seed Articles دی تعداد اے جنھاں دا اوہ حوالہ ݙیندن (مقامی باہر ویدݨ آلے حوالے)۔ مقامی حوالےآں دی تعداد ہمیشہ عالمی حوالےآں دی تعداد دے متناسب نئیں ہوندی۔ Seed Articles گول شکل (●) دے ہن۔ اتے دی طرف اشارہ کرݨ آلے تکوناں (▲) 'ٹاپ سائٹڈ' دی نمائندگی کریندن، جنھاں دا حوالہ Seed Articles ݙیندن۔
wikicite.lcn.window.faq.citation.content.p2=ہر کنارہ (= لنک / تیر) ہک حوالے دی نمائندگی کریندا اے: اے آپݨے ماخذ نوڈّاں کیتے باہر ویدݨ آلے حوالے ہن تے آپݨے ہدف نوڈّاں کیتے آن والے حوالے ہن۔ عام طور تے پیپر صرف پراݨے پیپرز دا حوالہ ݙے سگدن، ایندی وجہ توں کنارے عموماً تلے دی طرف اشارہ کریندن (یا ہک ہی سال دے حوالےآں کیتے پاسے دی طرف)۔ تکنیکی طور تے حوالہ نیٹ ورک ہک ڈائریکٹڈ ایسیکلک گراف اے۔
wikicite.lcn.window.faq.citation.header=حوالہ نیٹ ورک کیویں پڑھو؟
wikicite.lcn.window.faq.coauthorship.content.p1=اے 'مقامی' مشترکہ مصنفی نیٹ ورک Seed Articles وچوں سبھ توں عام مصنفاں کوں ݙکھیندا اے۔ مضمون دے شعبے دے لحاظ نال، کئی مضامین دے ہک سیٹ وچ (مشترکہ) مصنفاں دی تعداد چھیتی سینکڑیاں تک ودھ سگدی اے، ایندی وجہ توں اے مصنف نیٹ ورک صرف اونھاں مصنفاں کوں ݙکھیندا اے جنھاں کول Seed Articles دی گھٹو گھٹ تعداد ہووے (اینھاں کوں اونھاں دی عالمی اشاعت دی تعداد نال نہ رلاݨا، جیڑھی عام طور تے ودھ ہوندی اے)۔ Seed Articles دی ڈیفالٹ گھٹو گھٹ تعداد اینجھی مقرر کیتی ڳئی اے جو اے نیٹ ورک 50 توں ودھ مصنفاں کوں نہ ݙکھاوے، پر اینکوں تلے ݙتے ڳئے ڈراپ ڈاؤن نال بدلا وݨا۔
wikicite.lcn.window.faq.coauthorship.content.p2=ہر نوڈ (= ورٹیکس) ہک مصنف دی نمائندگی کریندا اے۔ اونھاں دا سائز اونھاں دے Seed Articles دی تعداد تے منحصر اے تے اونھاں دا رنگ اونھاں دے پہلے یا آخری Seed Article تے منحصر اے جینکوں اونھاں مشترکہ طور تے لکھیا۔ مضامین-ٹیبلّاں کوں فلٹر کرݨ کیتے مصنفاں تے کلک کرو، ہک توں ودھ مصنف کیتے فلٹر کرݨ کیتے ctrl+کلک کرو۔ نوڈّاں کوں مڑ ترتیب ݙیوݨ کیتے گھسیٹو۔
wikicite.lcn.window.faq.coauthorship.content.p3=ہر کنارہ (= لنک) Seed Articles وچوں ݙو مصنفاں وچکار تعاون دی نمائندگی کریندا اے، جینکوں دی چوڑائی Seed Articles دی تعداد ݙکھیندی اے۔ مضامین-ٹیبلّاں کوں فلٹر کرݨ کیتے کنارےآں تے کلک کرو۔
